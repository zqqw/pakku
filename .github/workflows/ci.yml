name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pakku links libalpm and targets Arch, so CI runs in an Arch container.
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: pacman -Syu --needed --noconfirm asciidoc curl git nim

      - name: Nim version
        run: nim --version

      - name: Tests
        run: nim test

      - name: Makefile smoke test
        run: nim testmakefile
